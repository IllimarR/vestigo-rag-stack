# Serve the Vestigo admin-ui SPA on port 3000.
#
# Single-page apps need `try_files $uri /index.html` so client-side
# routes (anything other than `/`) hit the SPA shell instead of nginx
# 404-ing on missing files. We don't have client-side routes today,
# but adding this now keeps a hidden footgun off the floor.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the hashed asset bundles (Vite writes content-hashed
    # filenames so cache invalidation is automatic on rebuilds).
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
